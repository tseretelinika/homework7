
{% extends 'base.html' %}

{% block content %}

<div class="card">
    <h1>ჩემი ჰობები</h1>

    <ul>
        {% for hobby in hobbies %}
            <li>{{ hobby }}</li>
        {% endfor %}
    </ul>

    {% if grade == 12 %}
        <h2 class="status">აბიტურიენტი</h2>
    {% else %}
        <h2 class="status">მომავალი აბიტურიენტი</h2>
    {% endif %}

    <a class="button" href="/">უკან დაბრუნება</a>
</div>

{% endblock %}
